    <!-- ⚡ INLINE SCRIPT POUR PERF MAXIMALE - DÉSACTIVER ANIMATIONS AU DÉMARRAGE -->
    <script>
        // Désactiver les animations AVANT le rendu
        document.documentElement.classList.add('no-animations-startup')
        const s = document.createElement('style')
        s.id = 'perf-startup'
        s.textContent = '.no-animations-startup * { animation: none !important; transition: none !important; }'
        document.head.appendChild(s)
        
        // Réactiver après le chargement
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.documentElement.classList.remove('no-animations-startup')
                const ps = document.getElementById('perf-startup')
                if (ps) ps.remove()
            }, 1500)
        }, { once: true })
    </script>
